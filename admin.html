<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NXT GEN ESPORTS | Owner Panel</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand">NXT GEN <small>ESPORTS</small></div><button class="signin" id="logout">Logout</button></header><main class="section"><div class="panel" id="loginPanel"><p class="eyebrow">OWNER PANEL</p><h2>Owner Login</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary">Sign In</button><p class="tiny" id="loginMsg"></p></form></div><div id="dashboard" style="display:none"><div class="panel"><p class="eyebrow">CONTROL CENTER</p><h2>Registrations</h2><div class="contact-card"><b>All registrations</b><button class="primary" id="toggleAll">Loading…</button></div><label>Scrim Date<input id="date" type="date"></label><div id="timings"></div></div><div class="panel"><p class="eyebrow">MANUAL WHATSAPP ENTRY</p><h2>Add Team</h2><form id="manualForm"><label>Team Name<input id="mTeam" required></label><label>Contact Number<input id="mPhone" required inputmode="numeric"></label><label>Timing<select id="mTiming"><option value="1">1–3 PM</option><option value="2">3–5 PM</option><option value="3">5–7 PM</option><option value="4">7–9 PM</option><option value="5">9–11 PM</option><option value="6">11 PM–1 AM</option></select></label><label>Number of Slots<input id="mSlots" type="number" min="1" max="4" value="1"></label><label>Price Category<select id="mPrice"><option>₹40</option><option>₹60</option><option>₹120</option></select></label><button class="primary">Add Team</button><p class="tiny" id="manualMsg"></p></form></div><div class="panel"><p class="eyebrow">MATCHES</p><h2>Daily Match Schedule</h2><button class="primary" id="createMatches">Create 24 Matches For Date</button><p class="tiny" id="matchMsg"></p></div><div class="panel"><p class="eyebrow">TEAM LIST</p><h2>Registrations</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Team</th><th>Timing</th><th>Status</th><th>Contact</th><th>Action</th></tr></thead><tbody id="regBody"></tbody></table></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
