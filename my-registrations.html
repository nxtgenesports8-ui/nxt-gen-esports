<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Registrations</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><a class="brand" href="index.html"><div class="logo">NG</div><div>NXT GEN<small>ESPORTS</small></div></a><button class="round menu">☰</button></header><main class="page"><div class="kicker">ACCOUNT</div><h1>My Registrations</h1><div id="list" class="cards"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>(async()=>{const u=await guard();if(!u)return;const {data,error}=await sb.rpc("get_my_registrations");const el=document.querySelector("#list");if(error)return el.innerHTML=`<div class="panel">${error.message}</div>`;el.innerHTML=(data||[]).map(r=>`<div class="card"><div class="card-body"><span class="tag">${r.status||"confirmed"}</span><h3>${r.team_name}</h3><p>${r.scrim_date||""} • ${r.timing||r.timing_id||""}</p><p>${r.price_category} • ${r.contact_number}</p></div></div>`).join("")||'<div class="panel">No registrations yet.</div>';})();</script></body></html>
