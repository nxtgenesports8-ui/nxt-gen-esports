<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><a class="brand" href="scrims.html"><div class="logo">NG</div><div>NXT GEN<small>ESPORTS</small></div></a><button class="round menu">☰</button></header><main class="page"><div class="panel"><div class="kicker">REGISTRATION</div><h1>Join the Scrim</h1><p id="selected" class="muted"></p><form id="form"><label>Team name</label><input class="field" id="team" required placeholder="Enter team name"><label>WhatsApp / contact number</label><input class="field" id="phone" required inputmode="tel" placeholder="10-digit number"><label>Date</label><input class="field" id="date" type="date" required><label>Timing</label><select class="field" id="timing" required><option value="">Select timing</option><option>1-3 PM</option><option>3-5 PM</option><option>5-7 PM</option><option>7-9 PM</option><option>9-11 PM</option><option>11 PM-1 AM</option></select><label>Slots</label><select class="field" id="slots"><option value="1">1 slot</option><option value="2">2 slots</option><option value="3">3 slots</option><option value="4">4 slots</option></select><button class="btn" type="submit">Register & Deduct Wallet</button></form><p id="msg" class="notice" style="margin-top:12px"></p></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
const q=new URLSearchParams(location.search),fee=q.get("fee")||"40";document.querySelector("#selected").textContent=(q.get("type")||"Scrim")+" • Entry ₹"+fee;document.querySelector("#date").value=new Date().toISOString().slice(0,10);
document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const u=await guard();if(!u)return;const timingText=document.querySelector("#timing").value;const {data:t,error:te}=await sb.from("scrim_timings").select("id").eq("timing",timingText).single();if(te){document.querySelector("#msg").textContent="Timing could not be loaded.";return}const {data,error}=await sb.rpc("submit_registration_with_wallet",{p_team_name:document.querySelector("#team").value.trim(),p_contact_number:document.querySelector("#phone").value.trim(),p_timing_id:t.id,p_scrim_date:document.querySelector("#date").value,p_number_of_slots:Number(document.querySelector("#slots").value),p_price_category:fee});document.querySelector("#msg").textContent=error?error.message:"Registration confirmed. Your wallet was charged ₹"+fee+".";if(!error)setTimeout(()=>location.href="my-registrations.html",1000)};
</script></body></html>
