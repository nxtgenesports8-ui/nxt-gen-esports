<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NXT GEN Registration</title><link rel="stylesheet" href="style.css"></head><body><header>☰ <b>NXT GEN ESPORTS</b> ◉</header><main><section class="card"><small>SCRIM REGISTRATION</small><h1>Choose Your Scrim</h1><p>Select date, timing and register your team.</p></section><section class="card"><h2>Match Date</h2><input type="date"><h2>Entry Fee</h2><div class="row"><button>₹40</button><button>₹60</button><button>₹120</button></div><h2>IDP Timing</h2><div id="timings"></div><h2>Map Rotation</h2><div class="maps">ERANGEL → MIRAMAR → RONDO → ERANGEL</div><h2>Team Details</h2><input placeholder="Team name"><input placeholder="Phone number"><button class="go">CONFIRM REGISTRATION</button></section></main><script>const t={'1-3 PM':['1:42 PM','2:12 PM','2:42 PM','3:12 PM'],'3-5 PM':['3:42 PM','4:12 PM','4:42 PM','5:12 PM'],'5-7 PM':['5:42 PM','6:12 PM','6:42 PM','7:12 PM'],'7-9 PM':['7:42 PM','8:12 PM','8:42 PM','9:12 PM'],'9-11 PM':['9:42 PM','10:12 PM','10:42 PM','11:12 PM'],'11 PM-1 AM':['11:42 PM','12:12 AM','12:42 AM','1:12 AM']};document.getElementById('timings').innerHTML=Object.entries(t).map(([k,v])=>`<div class="tim"><b>${k}</b><span>${v.join(' • ')}</span></div>`).join('');</script></body></html>
