<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - NXT GEN</title><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><a href="scrims.html" class="brand">NXT GEN <span>ESPORTS</span></a></header>
<main class="container"><div class="panel"><h1>Register your team</h1><p class="muted">Registration fee is deducted from your wallet.</p>
<form id="registerForm"><label>Team name<input id="teamName" required></label><label>Contact number<input id="contact" inputmode="tel" required></label><label>Slot timing<select id="timing" required><option value="">Select timing</option><option>1-3 PM</option><option>3-5 PM</option><option>5-7 PM</option><option>7-9 PM</option><option>9-11 PM</option><option>11 PM-1 AM</option></select></label><label>Number of slots needed<input id="slots" type="number" min="1" max="18" value="1" required></label><label>Price category<select id="price" required><option value="40">₹40</option><option value="60">₹60</option><option value="120">₹120</option></select></label><label>Scrim date<input id="scrimDate" type="date" required></label><button class="btn" type="submit">Confirm registration</button><p id="message"></p></form></div></main><script src="app.js"></script><script src="register.js"></script></body></html>
